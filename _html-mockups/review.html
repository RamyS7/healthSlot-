<!-- Suppress BottomNav and Drawer as this is a transactional task -->
<script>
        // Simple star rating interaction
        const stars = document.querySelectorAll('.star-rating .material-symbols-outlined');
        const ratingInput = document.getElementById('ratingValue');
        let currentRating = 0;

        stars.forEach(star => {
            star.addEventListener('click', (e) => {
                currentRating = parseInt(e.target.getAttribute('data-value'));
                ratingInput.value = currentRating;
                updateStars(currentRating);
            });
        });

        function updateStars(rating) {
            stars.forEach((s, index) => {
                if (index < rating) {
                    s.classList.remove('text-outline-variant');
                    s.classList.add('text-primary');
                    s.style.fontVariationSettings = "'FILL' 1";
                } else {
                    s.classList.remove('text-primary');
                    s.classList.add('text-outline-variant');
                    s.style.fontVariationSettings = "'FILL' 0";
                }
            });
        }
    </script>
